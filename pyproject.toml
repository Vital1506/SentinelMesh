[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelmesh"
version = "1.0.0"
description = "Adaptive deception honeypot and threat-intelligence correlation platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Codex" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "reportlab>=4.2",
]

[project.optional-dependencies]
intel = [
  "httpx>=0.27",
  "stix2>=3.0",
]
analytics = [
  "numpy>=1.26",
  "scikit-learn>=1.5",
]
ssh = [
  "asyncssh>=2.14",
]
ml = [
  "torch>=2.3",
]
dev = [
  "bandit>=1.7",
  "coverage[toml]>=7.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
sentinelmesh = "sentinelmesh.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["sentinelmesh*"]
exclude = ["data*", "deploy*", "docs*", "models*", "reports*", "scripts*", "tests*"]

[tool.setuptools.package-data]
sentinelmesh = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["sentinelmesh"]

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
# Security rules are omitted because this honeypot intentionally contains fake
# credentials, attacker commands, shell transcripts, and decoy fallbacks.
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "RUF"]
ignore = ["S104", "S101", "S106", "S108", "S310", "S311"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "UP006", "UP017"]
"tests/**" = ["S101", "F401", "I001"]
"**/__main__.py" = ["I001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["reportlab.*", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "asyncssh.*"
ignore_missing_imports = true
disallow_untyped_defs = false
allow_untyped_calls = true
